<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>就活スケジュール</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="auth" class="auth hidden">
    <div class="auth-card">
      <h1>就活スケジュール</h1>
      <p class="sub">ES・面接・適性検査をまとめて管理</p>
      <form id="auth-form">
        <label>ユーザー名
          <input id="a-user" autocomplete="username" required placeholder="半角英数字 3〜30文字">
        </label>
        <label>パスワード
          <input id="a-pass" type="password" autocomplete="current-password" required placeholder="8文字以上">
        </label>
        <p id="auth-err" class="error"></p>
        <button type="submit" id="auth-submit" class="btn primary">ログイン</button>
        <button type="button" id="auth-toggle" class="btn link">アカウントを新規作成する</button>
      </form>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand">就活スケジュール</div>
      <nav id="nav">
        <a href="#/" data-r="calendar">カレンダー</a>
        <a href="#/companies" data-r="companies">企業</a>
        <a href="#/list" data-r="list">項目別</a>
        <a href="#/todo" data-r="todo">やること</a>
        <a href="#/settings" data-r="settings">設定</a>
      </nav>
      <div class="user"><span id="whoami"></span><button id="logout" class="btn small">ログアウト</button></div>
    </header>
    <main id="view"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
